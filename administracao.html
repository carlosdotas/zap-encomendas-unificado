<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração geral | Zap Encomendas</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f6;color:#183b2c;font:16px system-ui,Arial}header{background:#126b45;color:#fff;padding:20px 5vw;display:flex;justify-content:space-between;gap:10px}a{color:inherit}main{max-width:720px;margin:40px auto;padding:0 20px}.panel{background:white;padding:25px;border:1px solid #dce8df;border-radius:18px;box-shadow:0 10px 30px #183b2c12}label{display:block;margin:18px 0;font-weight:650}select,input{width:100%;display:block;padding:13px;margin-top:8px;border-radius:10px;border:1px solid #bfd2c5;background:#f8fbf9;font:inherit}button{border:0;border-radius:10px;background:#147a4c;color:#fff;padding:14px 22px;font-weight:700;cursor:pointer}#message{margin-top:16px;color:#8c4425}p{color:#687d71}</style></head><body><header><strong>Zap Encomendas · Administração geral</strong><a href="/">Voltar</a></header><main><h1>Transportadoras</h1><p>Somente contas com permissão de administrador geral podem alterar senhas.</p><section class="panel"><h2>Redefinir senha da transportadora</h2><form id="form"><label>Transportadora<select id="transportadora" required><option value="">Carregando…</option></select></label><label>Nova senha<input id="senha" type="password" minlength="12" maxlength="256" autocomplete="new-password" required placeholder="Mínimo 12 caracteres, letras e números"></label><label>Confirmar senha<input id="confirmacao" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Alterar senha e encerrar sessões</button></form><div id="message" role="status"></div></section></main><script>const msg=document.getElementById('message'),select=document.getElementById('transportadora');async function init(){try{const r=await fetch('/api/admin/transportadoras',{credentials:'same-origin'}),j=await r.json();if(!r.ok)throw Error(j.error||'Sem permissão');select.replaceChildren();for(const t of j.transportadoras){const o=document.createElement('option');o.value=t.id;o.textContent=t.nome;select.appendChild(o)}if(!j.transportadoras.length)msg.textContent='Nenhuma transportadora cadastrada'}catch(e){msg.textContent=e.message;select.replaceChildren();document.querySelector('button').disabled=true}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const senha=document.getElementById('senha').value;if(senha!==document.getElementById('confirmacao').value){msg.textContent='As senhas não coincidem';return}if(!confirm('Confirmar redefinição da senha? As sessões da transportadora serão encerradas.'))return;try{const r=await fetch('/api/admin/reset-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({transportadora_id:Number(select.value),nova_senha:senha})}),j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao alterar');msg.textContent=j.mensagem;e.target.reset()}catch(err){msg.textContent=err.message}});init();</script></body></html>
