:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:50px;font-size:14px;font-weight:700;color:#98551c;pointer-events:none}.slider-wrap input{position:absolute;inset:0;width:100%;height:100%;appearance:none;-webkit-appearance:none;background:transparent;margin:0;cursor:grab}.slider-wrap input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#ffb04f,#f58220 55%,#d9650c);box-shadow:0 3px 10px #b85c2480;border:4px solid white}.slider-wrap input::-moz-range-thumb{width:54px;height:54px;border-radius:50%;background:#f58220;border:4px solid white}.small-muted{font-size:13px;color:#819187;margin:18px 0 0}.map-page{height:100dvh;position:relative;overflow:hidden;background:#e7ebe7}.map-canvas{position:absolute;inset:0;z-index:0}.control{position:absolute;z-index:500;width:50px;height:50px;border:1px solid #e0e7e2;background:white;border-radius:15px;display:grid;place-items:center;box-shadow:0 3px 14px #0002;color:#26463c}.control svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.top-left{top:max(16px,env(safe-area-inset-top));left:16px}.top-right{top:max(16px,env(safe-area-inset-top));right:16px;border-radius:50%}.bottom-right{right:16px;bottom:calc(22px + env(safe-area-inset-bottom))}.bottom-right.second{bottom:calc(84px + env(safe-area-inset-bottom))}.danger{color:#d43b3b}.overlay{position:absolute;inset:0;z-index:1000;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{background:white;border-radius:19px;padding:25px;width:min(100%,360px);box-shadow:0 10px 30px #0003}.dialog h2{margin:0 0 12px;font-size:20px}.dialog p{line-height:1.5;color:#62756b}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;padding:13px 8px;border-radius:10px;font-weight:bold}.actions .confirm{background:#dc3c3c;color:white}.actions .cancel{backg /* Identidade visual inspirada na marca: azul-marinho, laranja e off-white */
:root{color:#193b59}
.screen{background:linear-gradient(145deg,#f7f4ef 0%,#e7edf3 100%)}
.auth-card,.start-card{border-radius:10px;box-shadow:0 15px 45px #183b591c;border:1px solid #dce3e9}
.logo{display:block;width:105px;height:105px;object-fit:contain;border-radius:0;background:transparent;margin:0 auto 17px}
.auth-card h1,.start-card h1{color:#183b59}
.subtitle,.small-muted{color:#657587}
.field{color:#193b59}
.field input{border-radius:6px;border-color:#c8d3dc;outline-color:#f58220}
.field input:focus{border-color:#f58220}
.primary{background:#f58220;color:#fff;border-radius:6px}
.primary:hover{background:#e87512}
.link-btn{color:#193b59}
.status{background:#fff1e4;color:#a65b12;border-radius:6px}
.status:before{background:#f58220}
.slider-wrap{border-radius:8px;background:#e8eef3;border-color:#cad7e2}
.slider-fill{background:#f8c69e}
.slider-label{color:#193b59}
.slider-wrap input::-webkit-slider-thumb{border-radius:7px;background:#f58220;box-shadow:0 2px 10px #e8751255}
.slider-wrap input::-moz-range-thumb{border-radius:7px;background:#f58220}
.control{border-radius:8px;color:#193b59;border-color:#d5dce3}
.control.top-right{border-radius:8px}
.control.danger{color:#e25b32}
.dialog{border-radius:9px}
.actions button{border-radius:6px}
.actions .confirm{background:#e25b32}
.actions .cancel{background:#e8edf2;color:#193b59}
.toast{background:#193b59;border-radius:7px}
.menu-item{color:#193b59}

/* Campos padronizados */
.auth-card{padding:32px 28px;max-height:calc(100dvh - 24px);overflow-y:auto}
.auth-card form{display:flex;flex-direction:column;gap:17px}
.auth-card .field{display:flex;flex-direction:column;gap:7px;margin:0;font-size:13px;font-weight:700;letter-spacing:.1px}
.auth-card .field input{margin:0;height:52px;padding:0 15px;border:1px solid #bccbd8;border-radius:5px;background:#fcfdff;color:#193b59;font-size:16px;transition:border-color .15s,box-shadow .15s}
.auth-card .field input::placeholder{color:#8898a8;font-weight:400}
.auth-card .field input:focus{outline:none;border-color:#f58220;box-shadow:0 0 0 3px #f5822026;background:#fff}
.auth-card .primary{height:52px;margin-top:3px;font-size:16px}
.auth-card .subtitle{margin-bottom:24px}
.auth-card .switch{margin-top:20px}
@media(max-width:400px){.screen{padding:14px}.auth-card,.start-card{padding:25px 20px}}

/* Navegação lateral e perfil */
.drawer-backdrop{position:absolute;inset:0;z-index:1100;background:#102b42a8}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(330px,88vw);background:#fff;box-shadow:8px 0 35px #102b4230;display:flex;flex-direction:column;overflow-y:auto}
.drawer-head{background:#193b59;color:white;padding:calc(28px + env(safe-area-inset-top)) 22px 22px;position:relative}
.drawer-close{position:absolute;right:14px;top:18px;border:0;background:#ffffff20;color:white;font-size:26px;width:36px;height:36px;border-radius:5px}
.drawer-person{display:flex;align-items:center;gap:12px;margin-top:10px}
.avatar{width:60px;height:60px;object-fit:cover;border-radius:50%;background:#e7edf2;border:3px solid #fff;display:grid;place-items:center;color:#193b59;font-weight:700;font-size:22px;flex-shrink:0}
.drawer-item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 23px;border:0;background:#fff;color:#193b59;font-weight:600;font-size:15px}
.drawer-item:hover,.drawer-item:focus{background:#f1f5f8}.drawer-item .glyph{width:25px;text-align:center;font-size:20px;color:#f58220}
.drawer-label{padding:21px 23px 8px;color:#8291a0;font-size:11px;letter-spacing:1.2px;font-weight:800}
.drawer-footer{margin-top:auto;border-top:1px solid #e5eaf0;padding:8px 0 18px}
.profile-page{min-height:100dvh;background:#f2f5f8;color:#193b59;padding-bottom:40px}
.profile-bar{height:68px;background:#193b59;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px}
.profile-bar button{border:0;background:none;color:inherit;font-size:26px;padding:6px}
.profile-content{max-width:560px;margin:0 auto;padding:22px 16px}
.profile-card{background:#fff;border:1px solid #dce3e9;border-radius:8px;padding:22px;margin-bottom:16px;box-shadow:0 5px 20px #193b5909}
.profile-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#e8edf3;display:grid;place-items:center;margin:0 auto 14px;border:4px solid #f3f5f8;color:#193b59;font-size:38px;font-weight:700}
.upload-label{display:inline-block;border:1px solid #f58220;color:#b85b0d;background:#fff8f1;padding:11px 18px;border-radius:5px;cursor:pointer;font-size:14px;font-weight:700}
.profile-card h2{font-size:17px;margin:0 0 17px}
.profile-field{display:block;font-size:13px;font-weight:700;margin-bottom:16px}
.profile-field input{display:block;width:100%;height:48px;border:1px solid #c7d2dc;border-radius:5px;margin-top:7px;padding:0 13px;font-size:16px;color:#193b59;background:white}
.profile-field input:focus{outline:2px solid #f5822060;border-color:#f58220}
.profile-note{color:#687a8b;font-size:12px;line-height:1.5}
.profile-message{padding:12px;background:#eaf5ef;color:#23633b;border-radius:5px;font-size:13px;margin-top:12px}
.drawer-close{z-index:20;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}.drawer{touch-action:pan-y;animation:drawerSlide .22s ease-out}.drawer-backdrop{animation:drawerFade .2s ease-out}@keyframes drawerSlide{from{transform:translateX(-100%)}to{transform:translateX(0)}}@keyframes drawerFade{from{opacity:0}to{opacity:1}}

/* Controle de ativação com aparência de botão físico, arredondado */
.slider-wrap{height:76px;border-radius:999px;background:linear-gradient(180deg,#e7edf4 0%,#f7f9fc 100%);border:1px solid #c7d3df;box-shadow:inset 0 3px 7px #183b5920,0 3px 12px #193b5910;overflow:hidden;touch-action:pan-y}
.slider-fill{background:linear-gradient(90deg,#ffd6b0,#f8a354);border-radius:999px;transition:width .08s linear}
.slider-label{color:#193b59;font-weight:800;letter-spacing:.1px;text-shadow:0 1px 0 #fff9}
.slider-wrap input{height:100%;outline-offset:4px;touch-action:pan-y}
.slider-wrap input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 32% 24%,#ffbd70 0%,#fb922d 38%,#e66b0b 100%);box-shadow:inset 0 2px 3px #fff8,inset 0 -4px 7px #a94b1466,0 4px 10px #8c4c2a66,0 0 0 1px #c9651c;cursor:grab}
.slider-wrap input:active::-webkit-slider-thumb{cursor:grabbing;box-shadow:inset 0 3px 7px #8b430a66,0 2px 5px #8c4c2a55,0 0 0 1px #c9651c}
.slider-wrap input::-moz-range-thumb{width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 32% 24%,#ffbd70,#fb922d 40%,#e66b0b);box-shadow:inset 0 2px 3px #fff8,inset 0 -4px 7px #a94b1466,0 4px 10px #8c4c2a66;cursor:grab}

.vehicle-group{margin:19px 0 10px;text-align:left}.vehicle-title{font-size:13px;font-weight:700;color:#193b59;margin-bottom:9px}.vehicle-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.vehicle-option{border:1px solid #cdd7e0;border-radius:7px;background:#fff;padding:12px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;color:#193b59;font-size:12px;cursor:pointer}.vehicle-option.selected{background:#fff3e8;border:2px solid #f58220;padding:11px 4px;color:#ad4a00}.vehicle-option .vehicle-emoji{font-size:25px}.vehicle-choice{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:9px 0;border:1px solid #d6dfe7;border-radius:7px;text-align:left;cursor:pointer;background:#fff;color:#193b59}.vehicle-choice.selected{border:2px solid #f58220;background:#fff5ed;padding:11px 13px}.vehicle-choice input{accent-color:#f58220;width:18px;height:18px}.vehicle-choice .vehicle-emoji{font-size:26px}.vehicle-choice strong{font-size:14px}.vehicle-choice small{font-size:12px;color:#657587}.active-vehicle{font-size:13px;color:#193b59;margin:12px 0 0;font-weight:700}.vehicle-hint{font-size:12px;color:#657587;margin:8px 0 0;line-height:1.5}

/* Botão de sessão com captura de ponteiro: sem dependência do range nativo */
.slider-wrap{height:70px;border-radius:40px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden;position:relative}
.slider-wrap:active{cursor:grabbing}.slider-wrap.slider-disabled{opacity:.45;cursor:not-allowed}
.slider-fill{transition:width .08s linear;background:linear-gradient(90deg,#ffe6c8,#ffc68c)}
.slider-label{padding:0 30px 0 66px;font-size:14px;pointer-events:none}
.slider-knob{position:absolute;top:4px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;pointer-events:none;background:linear-gradient(145deg,#ffb955,#f58220 60%,#c9600a);border:3px solid #fff;box-shadow:0 4px 10px #8e4a2580,inset 0 2px 3px #ffffff70;transition:left .07s linear}
.slider-knob svg{width:25px;height:25px;fill:none;stroke:white;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.start-icon svg{width:50px;height:50px;stroke:#f58220;stroke-width:1.8;fill:none;stroke-linejoin:round;stroke-linecap:round}
.vehicle-emoji svg{width:28px;height:28px;stroke:#193b59;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.glyph svg,.active-vehicle svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;vertical-align:middle}
.drawer-close svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.top-notices{position:absolute;z-index:600;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.notice-pill{display:flex;align-items:center;justify-content:center;gap:9px;max-width:100%;padding:11px 17px;border-radius:999px;box-shadow:0 5px 18px #0002;font-size:13px;font-weight:700;white-space:nowrap;animation:notice-in .24s ease-out}
.notice-pill svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.notice-vehicle{background:#193b59;color:#fff}.notice-online{background:#e8f7ef;color:#176b40;border:1px solid #a5d7bc}.notice-offline{background:#fff1ed;color:#b43d26;border:1px solid #f3c2b5}
@keyframes notice-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* Tela de ativação compacta: sem rolagem em celulares usuais */
.start-screen{height:100dvh;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
.start-screen .start-card{width:min(100%,430px);max-height:100%;min-height:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.3dvh,13px);padding:clamp(12px,2.8dvh,24px) 18px;border-radius:12px;overflow:hidden}
.start-screen .logo{width:clamp(48px,9dvh,72px);height:clamp(48px,9dvh,72px);object-fit:contain;margin:0 auto;border-radius:8px;flex-shrink:0}
.start-screen h1{font-size:clamp(18px,3.5dvh,23px);line-height:1.15;margin:0}
.start-screen .subtitle{font-size:clamp(11px,1.9dvh,13px);line-height:1.3;margin:0;color:#627487}
.start-screen .vehicle-group{width:100%;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:stretch}
.start-screen .vehicle-title{grid-column:1/-1;font-size:12px;font-weight:700;text-align:left;margin:0 0 2px}
.start-screen .vehicle-choice{margin:0!important;min-width:0;min-height:clamp(58px,10dvh,78px);padding:7px 3px!important;border-radius:8px;display:flex!important;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center;line-height:1.1}
.start-screen .vehicle-choice input{position:absolute;opacity:0;pointer-events:none}
.start-screen .vehicle-emoji{margin:0!important;font-size:20px;line-height:1}
.start-screen .vehicle-emoji svg{width:23px;height:23px}
.start-screen .vehicle-choice strong{font-size:12px}
.start-screen .slider-wrap{width:100%;height:clamp(54px,9dvh,66px);flex-shrink:0;margin:clamp(4px,1dvh,10px) 0 0;border-radius:40px;touch-action:none}
.start-screen .slider-knob{width:clamp(46px,8dvh,58px);height:clamp(46px,8dvh,58px)}
.start-screen .slider-label{font-size:12px}
.start-screen .link-btn{margin:0!important;font-size:12px;padding:4px 10px;flex-shrink:0}
@media(max-height:590px){.start-screen .start-card{gap:5px;padding:8px 15px}.start-screen .logo{width:42px;height:42px}.start-screen .vehicle-choice{min-height:51px}.start-screen .vehicle-emoji svg{width:19px;height:19px}.start-screen .slider-wrap{height:54px}.start-screen .subtitle{font-size:11px}}

/* Marcadores legíveis: tipografia ampliada, hierarquia e contraste */
.job-div-icon{background:transparent;border:0;overflow:visible!important}
.job-pin{width:204px;height:145px;position:relative;filter:drop-shadow(0 4px 6px #13263b30)}
.job-pin-card{position:absolute;top:0;left:0;box-sizing:border-box;width:204px;min-height:109px;background:#fff;border:1px solid #cbd5e1;border-top:5px solid var(--job-color);border-radius:12px;padding:9px 11px 10px;box-shadow:0 7px 20px #102f4a40;text-align:left}
.job-coleta{--job-color:#08784a}.job-entrega{--job-color:#bb5c08}.job-troca{--job-color:#2459b9}
.job-place{font-weight:850;font-size:15px;line-height:19px;letter-spacing:-.2px;color:#102c47;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-carrier{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;line-height:23px;font-weight:600;color:#344b60;white-space:nowrap;overflow:hidden}
.job-carrier>span:last-child{overflow:hidden;text-overflow:ellipsis}
.job-avatar{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:#e7edf5;border:1px solid #cbd7e4;color:#193b59;font-size:10px;font-weight:800}
.job-icons{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:7px}
.job-icons svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.job-vehicle{display:flex;align-items:center;color:#193b59}
.job-operation{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--job-color) 11%,white);color:var(--job-color);font-size:12px;line-height:18px;font-weight:800}
.job-pointer{position:absolute;top:108px;left:calc(50% - 17px);width:34px;height:28px;color:var(--job-color);animation:job-bounce 1.35s ease-in-out infinite;z-index:2}
.job-pointer svg{width:34px;height:28px;fill:#fff;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #0004)}
.job-shadow{position:absolute;bottom:0;left:calc(50% - 17px);width:34px;height:9px;border-radius:50%;background:#16263865;filter:blur(4px);animation:job-shadow 1.35s ease-in-out infinite}
@keyframes job-bounce{0%,100%{transform:translateY(-5px)}50%{transform:translateY(1px)}}
@keyframes job-shadow{0%,100%{transform:scale(.75);opacity:.4}50%{transform:scale(1);opacity:.8}}
@media(prefers-reduced-motion:reduce){.job-pointer,.job-shadow{animation:none}}

.zap-cluster-wrap{background:transparent;border:0}
.zap-cluster{height:66px;width:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#f69b38,#e66f0c);border:4px solid #fff;box-shadow:0 3px 0 #b8540d,0 8px 18px #152e4b50;color:#fff;font-family:Arial,sans-serif;line-height:1.05;cursor:pointer}
.zap-cluster span{font-size:23px;font-weight:900}.zap-cluster small{font-size:9px;font-weight:700}
.slider-track,.slider-knob{touch-action:none;user-select:none;-webkit-user-select:none}
/* Marcador horizontal: ícone circular, informações à direita */
.job-pin{width:260px;height:125px;filter:none}

function Auth({onLogin,carrierMode=false}){const [busy,setBusy]=useState(false);const [confirmPassword,setConfirmPassword]=useState('');const [mode,setMode]=useState('login'),[name,setName]=useState(''),[phone,setPhone]=useState(''),[password,setPassword]=useState(''),[error,setError]=useState(''),[vehicles,setVehicles]=useState([]);const vehicleTypes=[['moto','bike','Moto'],['carro','car','Carro'],['utilitario','truck','Utilitário']];function toggleVehicle(v){setVehicles(prev=>prev.includes(v)?prev.filter(x=>x!==v):[...prev,v])}async function submit(e){e.preventDefault();setError('');if(busy)return;if(mode==='register'&&name.trim().length<3){setError('Informe seu nome completo.');return}if(phone.replace(/\D/g,'').length<10){setError('Informe um telefone válido com DDD.');return}if(mode==='register'&&password.length<6){setError('A senha deve ter pelo menos 6 caracteres.');return}if(mode==='register'&&password!==confirmPassword){setError('As senhas não coincidem.');return}if(mode==='login'&&!password){setError('Informe sua senha.');return}if(mode==='register'&&!carrierMode&&vehicles.length===0){setError('Selecione pelo menos um tipo de veículo.');return}setBusy(true);try{const response=await fetch(mode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name,phone,password,role:carrierMode?'transportadora':'motorista',vehicles})});const data=await response.json();if(!response.ok)throw new Error([data.error,data.code?('Código: '+data.code):'',data.hint||data.diagnostic?.hint||''].filter(Boolean).join(' — '));if(mode==='login'&&data.user.role!==(carrierMode?'transportadora':'motorista'))throw new Error('Esta conta pertence a outro tipo de acesso.');onLogin(data.user)}catch(err){setError(err.message)}finally{setBusy(false)}}return <main className="screen"><div className="auth-card"><Logo /><h1>{mode==='login'?'Entrar na Zap Encomendas':'Criar cadastro'}</h1><p class const zapSessionMemory={auth:null,profile:null};
function readZapState(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):zapSessionMemory[key==='zap_auth_state'?'auth':'profile']}catch{return zapSessionMemory[key==='zap_auth_state'?'auth':'profile']}}
function writeZapState(key,value){zapSessionMemory[key==='zap_auth_state'?'auth':'profile']=value;try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,JSON.stringify(value))}catch{}}
function App(){
 const [page,setPage]=useState('loading');
 React.useEffect(()=>{fetch('/api/auth/me',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw new Error('Sem sessão');return r.json()}).then(data=>{const u=data.user;setMasterMode(!!u.isMaster);setRole(u.role);setProfile(p=>({...p,name:u.name,phone:u.phone,vehicles:u.vehicles.length?u.vehicles:p.vehicles}));setPage(u.role==='transportadora'?'carrier':'map')}).catch(()=>setPage('choose'))},[]);
 const [role,setRole]=useState('motorista');
 const [profile,setProfile]=useState(()=>readZapState('zap_profile_demo')||{name:'Motorista',phone:'',photo:'',vehicles:['moto','carro','utilitario']});
 const [activeVehicle,setActiveVehicle]=useState(()=>readZapState('zap_auth_state')?.activeVehicle||'moto');
 const [returnPage,setReturnPage]=useState('map');
 const [masterMode,setMasterMode]=useState(false);
 const saveProfile=p=>{setProfile(p);writeZapState('zap_profile_demo',p)};
 const logout=async()=>{try{const response=await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});if(!response.ok)throw new Error('Falha ao sair');writeZapState('zap_auth_state',null);setPage('choose')}catch{window.alert('Não foi possível encerrar a sessão. Verifique sua conexão e tente novamente.')}};
 const switchMasterRole=async()=>{try{const next=role==='motorista'?'transportadora':'motorista';const response=await fetch('/api/auth/master/switch-role',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:next})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Falha ao trocar perfil');login(data.user)}catch(err){window.alert(err.message)}};
 const login=(user)=>{setMasterMode(!!user.isMaster);setRole(user.role);if(user.role==='transportadora'){setPage('carrier');return}const v=user.vehicles.length?user.vehicles:['moto'];saveProfile({...profile,name:user.name,phone:user.phone,vehicles:v});setActiveVehicle(v[0]);setPage('map')};
 return <>{masterMode&&page!=='choose'&&page!=='auth'&&page!=='loading'&&<div style={{position:'fixed',top:8,left:'50%',transform:'translateX(-50%)',zIndex:99999,display:'flex',gap:8,alignItems:'center',padding:'6px 10px',borderRadius:12,background:'#173a35',color:'#fff',boxShadow:'0 3px 12px #0004',fontSize:12}}><span>Mestre • visualização</span><button type="button" onClick={switchMasterRole} style={{border:0,borderRadius:8,padding:'6px 9px',cursor:'pointer'}}>Alternar perfil</button></div>}{page==='loading'?<main className="screen"><p>Verificando sessão...</p></main>:page==='choose'?<RoleChoice onChoose={r=>{setRole(r);setPage('auth')}}/>:page==='auth'?<Auth carrierMode={role==='transportadora'} onLogin={login}/>:page==='carrier'?<CarrierDashboard onBack={logout}/>:page==='profile'?<ProfilePage profile={profile} onSave={saveProfile} onBack={()=>setPage(returnPage)}/>:<MapView profile={profile} activeVehicle={activeVehicle} onEnd={logout} onLogout={logout} onProfile={()=>{setReturnPage('map');setPage('profile')}}/>}</>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script>window.addEventListener('error',function(e){if(!document.getElementById('root').children.length){document.getElementById('root').innerHTML='<div style="font:16px Arial;padding:30px;text-align:center"><h2>Não foi possível carregar o aplicativo</h2><p>O visualizador pode estar bloqueando os scripts externos (React/Babel). Abra o HTML no navegador ou hospede os arquivos.</p></div>';}});</script></body></html>
